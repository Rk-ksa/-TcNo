name: Build and publish Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to upload to
        required: true
        default: v4.0.8-rkksa

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS on the temporary runner
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Download the published app executable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          gh release download $env:RELEASE_TAG --pattern 'TcNo-Acc-Switcher-Rk-ksa.exe' --dir bin --repo $env:GITHUB_REPOSITORY
          Move-Item 'bin/TcNo-Acc-Switcher-Rk-ksa.exe' 'bin/TcNo-Acc-Switcher-Polished.exe' -Force

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tmp/release-assets | Out-Null
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) { throw "NSIS compiler missing: $makensis" }
          & $makensis /V2 build/windows/nsis/rkksa-installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path '.tmp/release-assets/TcNo-Acc-Switcher-Rk-ksa-Setup.exe')) { throw 'Installer output missing.' }

      - name: Upload installer to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG '.tmp/release-assets/TcNo-Acc-Switcher-Rk-ksa-Setup.exe' --repo $env:GITHUB_REPOSITORY --clobber
