name: Build and publish Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to upload to
        required: true
        default: v4.0.8-rkksa

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS on the temporary runner
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Download the published app executable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'User-Agent' = 'Rk-ksa-installer-builder' }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/${{ inputs.release_tag }}" -Headers $headers
          $asset = $release.assets | Sort-Object size -Descending | Select-Object -First 1
          if (-not $asset) { throw 'The executable asset is missing from the selected release.' }
          $headers.Accept = 'application/octet-stream'
          Invoke-WebRequest -Uri $asset.url -Headers $headers -OutFile 'bin/TcNo-Acc-Switcher-Polished.exe'

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tmp/release-assets | Out-Null
          if (-not (Test-Path 'bin/TcNo-Acc-Switcher-Polished.exe')) { throw 'Downloaded app executable is missing.' }
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) { throw "NSIS compiler missing: $makensis" }
          $root = $env:GITHUB_WORKSPACE
          & $makensis /V2 "/DAPP_BINARY=$root\bin\TcNo-Acc-Switcher-Polished.exe" "/DAPP_LICENSE=$root\LICENSE" "/DOPEN_SOURCE_LICENSES=$root\OPEN_SOURCE_LICENSES.txt" "/DINSTALLER_OUTPUT=$root\.tmp\release-assets\TcNo-Acc-Switcher-Rk-ksa-Installer.exe" build/windows/nsis/rkksa-installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path '.tmp/release-assets/TcNo-Acc-Switcher-Rk-ksa-Installer.exe')) { throw 'Installer output missing.' }

      - name: Upload installer to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG '.tmp/release-assets/TcNo-Acc-Switcher-Rk-ksa-Installer.exe' --repo $env:GITHUB_REPOSITORY --clobber
